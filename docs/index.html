<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fr-donaties — overzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --accent: hsl(18.84, 67.6%, 35.1%); --petrol: hsl(182, 32.61%, 18.04%); --grijs: hsl(0, 0%, 42%); --rand: hsl(0, 0%, 88%); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Poppins", system-ui, sans-serif; color: hsl(0, 0%, 11%); line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { color: var(--petrol); margin: 0 0 .25rem; font-size: 1.6rem; }
  h2 { color: var(--petrol); font-size: 1.1rem; margin: 2rem 0 .6rem; }
  p { margin: 0 0 .75rem; color: var(--grijs); }
  a { color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .4rem; }
  li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; padding: .6rem .8rem; border: 1px solid var(--rand); border-radius: 10px; }
  .letter { font-weight: 600; color: var(--petrol); min-width: 1.2rem; }
  .naam { flex: 1; min-width: 12rem; }
  .los { font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>fr-donaties</h1>
  <p>Prototypes voor donatiepagina's van Stichting Forerunner.</p>

  <h2>Donatieformulier</h2>
  <ul>
    <li><span class="naam"><a href="doneer/index.html">Het huidige donatieformulier</a></span></li>
  </ul>

  <h2>Kerstactie: ontwerpen</h2>
  <p>Elk ontwerp opent in de pagina van forerunner.info. Wissel daar met de knoppen bovenaan. "Los" opent het ontwerp zonder omlijsting.</p>
  <ul id="ontwerpen"></ul>
</main>
<script>
  const ONTWERPEN = [
    ['A', 'actie-supp.html', 'Knoppen zoals supp'],
    ['B', 'actie-cadeaus.html', 'Alleen acties'],
    ['C', 'actie-cadeau-eerst.html', 'Eerst cadeau, dan gegevens'],
    ['D', 'actie-d-catalogus.html', 'Fotocatalogus met filter'],
    ['E', 'actie-e-menukaart.html', 'Menukaart'],
    ['F', 'actie-f-tabs.html', 'Tabs per project'],
    ['G', 'actie-g-carrousel.html', 'Carrousel per project'],
    ['H', 'actie-h-kerstlabels.html', 'Kerstlabels'],
    ['I', 'actie-i-bento.html', 'Bento-grid'],
    ['J', 'actie-j-zigzag.html', 'Magazine-zigzag'],
    ['K', 'actie-k-accordeon.html', 'Projectkaarten met accordeon'],
    ['L', 'actie-l-prijsladder.html', 'Prijsladder'],
  ];
  const lijst = document.getElementById('ontwerpen');
  for (const [letter, bestand, naam] of ONTWERPEN) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="letter">${letter}</span>
      <span class="naam"><a href="supp/index.html?ontwerp=${bestand}">${naam}</a></span>
      <a class="los" href="supp/${bestand}">los</a>`;
    lijst.append(li);
  }
</script>
</body>
</html>
