<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Home — Forerunner</title>
<!--
  Ontwerp D: grote gele kop.
  - Een grote gele kop met de titel in roest, "Doe jij mee?" en de kinderen
    met het gouden cadeau groot in beeld (op mobiel onderaan, op desktop rechts).
  - De introzinnen staan onder de kop, op het witte vlak van de flyer.
  - "Geef een cadeau" met de vier cadeaus als witte kaarten op salie, 2×2,
    met de prijs als roestkleurig label in de hoek en grote lijniconen.
  - Maandelijks is een vijfde kaart over de volle breedte in hetzelfde raster:
    een link naar de maandpagina, geen keuze in dit formulier.
  De opties, het formulier en de prototypemodus staan in gedeeld.js.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gedeeld.css">
<style>
  .pagina { padding-top: 1.25rem; }

  /* Grote gele kop */
  .held {
    background: var(--flyer-geel);
    border-radius: var(--radius) var(--radius) 0 0;
    overflow: hidden;
    padding: 1.5rem 1.25rem 0;
    display: grid;
  }
  .held h1 {
    margin: 0; color: var(--accent); font-weight: 700;
    font-size: clamp(2rem, 8.5vw, 3rem); line-height: 1.08;
  }
  .held .doe-mee { margin: .4rem 0 0; font-size: clamp(2.6rem, 11vw, 3.8rem); }
  .held img { display: block; width: 100%; max-width: 520px; height: auto; margin: .5rem auto 0; }
  @media (min-width: 640px) {
    .held { grid-template-columns: 1.3fr 1fr; align-items: end; gap: 0 1rem; padding: 2rem 1.5rem 0 2rem; min-height: 300px; }
    .held h1 { font-size: clamp(2rem, 4.6vw, 2.7rem); }
    .held .tekst { align-self: center; padding-bottom: 1.5rem; }
    .held img { margin: 0; max-width: none; }
  }

  .intro {
    background: var(--flyer-wit);
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 1rem 1.25rem 1.2rem;
  }
  .intro p { margin: 0; font-size: 1rem; }
  .intro p + p { margin-top: .5rem; }
  @media (min-width: 640px) { .intro { padding: 1.2rem 2rem 1.4rem; } }

  /* Cadeaus */
  .kop-cadeau { margin: 1.6rem 0 .75rem; color: var(--accent); font-weight: 600; font-size: clamp(1.4rem, 5vw, 1.8rem); }
  .cadeaus { background: var(--flyer-salie); border-radius: var(--radius); padding: .9rem; }
  .raster { display: grid; gap: .8rem; grid-template-columns: 1fr 1fr; }
  .optie label {
    position: relative;
    height: 100%; min-height: 9.5rem;
    display: flex; flex-direction: column; justify-content: flex-end; gap: .55rem;
    padding: 1rem .9rem .9rem;
    background: #fff;
    border: 2px solid transparent;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(30, 60, 55, .18);
    transition: border-color .15s, background .15s;
  }
  .optie label:hover { border-color: var(--flyer-icoon); }
  .optie .icoon { width: 3.4rem; height: 3.4rem; color: var(--flyer-icoon); stroke-width: 1.3; }
  .optie .prijs {
    position: absolute; top: .6rem; right: .6rem;
    background: var(--accent); color: #fff;
    font-weight: 700; font-size: 1.05rem; line-height: 1;
    padding: .4rem .65rem; border-radius: 99px;
  }
  .optie .titel { display: block; font-size: .92rem; line-height: 1.3; }
  .optie .titel small { display: block; color: var(--grijs); font-size: .75rem; margin-top: .1rem; }
  .optie input:checked + label { border-color: var(--accent); background: var(--accent-licht); }
  .optie input:checked + label .icoon { color: var(--accent); }
  .optie input:checked + label .prijs::before { content: "✓ "; }
  @media (min-width: 640px) {
    .optie label { flex-direction: row; align-items: center; justify-content: flex-start; min-height: 7.5rem; padding: 1.1rem 1.1rem; gap: 1rem; }
    .optie .titel { font-size: 1rem; padding-right: 3.5rem; }
  }
  @media (max-width: 380px) {
    .optie .titel small { display: none; }
    .optie .icoon { width: 2.8rem; height: 2.8rem; }
  }

  /* Vijfde kaart: maandelijks */
  .maand {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: .9rem;
    min-height: 44px; padding: .95rem 1.1rem;
    background: var(--flyer-wit);
    border: 2px solid var(--petrol);
    border-radius: 12px;
    color: var(--petrol); text-decoration: none;
  }
  .maand:hover { background: #fff; }
  .maand:focus-visible { outline: 3px solid var(--salie); outline-offset: 2px; }
  .maand .icoon { width: 2.4rem; height: 2.4rem; flex: none; }
  .maand .wat { flex: 1; min-width: 0; }
  .maand strong { display: block; font-size: 1rem; }
  .maand span.sub { display: block; font-size: .88rem; }
  .maand .pijl { flex: none; font-size: 1.3rem; }
  #fout-keuze { margin: .6rem 0 0; }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div class="held">
      <div class="tekst">
        <h1>Geef kansarme kinderen hoop</h1>
        <p class="doe-mee">Doe jij mee?</p>
      </div>
      <img src="img/kinderen-cadeau.png" alt="Drie lachende kinderen van Grace Home met een cadeau" width="620" height="425">
    </div>
    <div class="intro">
      <p>Grace Home is het gezinshuis van een Indiase familie met wie we al 15 jaar samenwerken.</p>
      <p>Zij vangen kansarme (wees)kinderen op en geven hen zorg, voedsel, een liefdevol thuis en onderwijs.</p>
    </div>
  </header>

  <form id="donatie">
    <h2 class="kop-cadeau">Geef een cadeau</h2>
    <section class="cadeaus" id="stap-keuze" aria-label="Kies je cadeau">
      <div class="raster"></div>
      <p class="fout" id="fout-keuze" aria-live="polite"></p>
    </section>

    <section class="stap" id="stap-gegevens" data-gh-gegevens>
      <h2>Je gegevens</h2>
    </section>
  </form>
</div>

<script src="gedeeld.js"></script>
<script>
  const raster = document.querySelector('.raster');
  raster.innerHTML = GH.OPTIES.eenmalig.map((o) => `
    <div class="optie">
      ${GH.radio(o, 'eenmalig')}
      <label for="k-${o.id}">
        <span class="prijs">€ ${GH.euro(o.bedrag)}</span>
        ${GH.icoon(o.icoon)}
        <span class="titel">${o.titel}${o.id === 'startpakket' ? `<small>${o.uitleg}</small>` : ''}</span>
      </label>
    </div>`).join('') + `
    <a class="maand" href="b-maandelijks.html?terug=d-grote-kop.html">
      ${GH.icoon('hart')}
      <span class="wat"><strong>Wil je structureel helpen?</strong><span class="sub">Steun maandelijks of sponsor een kind</span></span>
      <span class="pijl" aria-hidden="true">→</span>
    </a>`;
  GH.start();
</script>
</body>
</html>
