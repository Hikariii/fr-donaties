<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Home — Forerunner</title>
<!--
  Ontwerp C: compact.
  - Geen grote kop: een gele band met "Doe jij mee?", de titel en één korte
    zin, en rechts de kinderen met het gouden cadeau, die iets boven de band
    uitsteken.
  - Direct onder de band een smalle regel naar maandelijks:
    "Wil je structureel helpen? Steun maandelijks of sponsor een kind".
  - De cadeaus als rustige rijen onder elkaar op salie: groot lijnicoon, titel,
    prijs rechts in roest. Van hoog naar laag.
  De opties, het formulier en de prototypemodus staan in gedeeld.js.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gedeeld.css">
<style>
  .pagina { padding-top: 3rem; }

  /* Gele band; de kinderen steken er bovenuit */
  .band {
    display: grid;
    background: var(--flyer-geel);
    border-radius: var(--radius);
    padding: 0 1.25rem 1.1rem;
  }
  .band .doe-mee { margin: 0; font-size: clamp(2rem, 8vw, 3rem); }
  .band h1 {
    margin: .2rem 0 0; color: var(--accent); font-weight: 600;
    font-size: clamp(1.4rem, 5.5vw, 1.9rem); line-height: 1.15;
  }
  .band .kort { margin: .6rem 0 0; font-size: .95rem; }
  /* Mobiel: de kinderen bovenaan, half boven de band uit, de tekst eronder */
  .kinderen {
    display: block; height: auto;
    width: 78%; justify-self: end; margin: -2.5rem -.5rem -.4rem 0;
  }
  @media (min-width: 640px) {
    .band { grid-template-columns: 1fr 44%; padding: 1.25rem 0 0 1.75rem; }
    .band .tekst { grid-column: 1; grid-row: 1; align-self: center; }
    .band .kort { grid-column: 1; grid-row: 2; margin: .5rem 0 0; padding: 0 1rem 1.5rem 0; }
    .kinderen { grid-column: 2; grid-row: 1 / span 2; align-self: end; width: 100%; margin: -3rem 0 0; }
  }

  .maandlijn {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    margin: .6rem 0 0; padding: .55rem 1rem; min-height: 44px;
    background: var(--flyer-wit); border-radius: 10px;
    color: var(--petrol); font-size: .88rem; text-decoration: none;
  }
  .maandlijn strong { font-weight: 600; }
  .maandlijn:hover { background: var(--salie-licht); }
  .maandlijn:focus-visible { outline: 3px solid var(--salie); outline-offset: 2px; }
  .maandlijn .pijl { flex: none; font-size: 1.15rem; }

  /* Cadeaus als rijen op salie */
  .cadeaus { margin-top: 1.25rem; background: var(--flyer-salie); border-radius: var(--radius); padding: .75rem; }
  .cadeaus h2 { margin: .25rem .4rem .7rem; font-size: 1.05rem; font-weight: 600; color: var(--petrol); }
  .opties { display: grid; gap: .5rem; }
  .optie label {
    display: flex; align-items: center; gap: .9rem;
    min-height: 44px; padding: .85rem 1rem;
    background: #fff; border: 2px solid transparent; border-radius: 10px;
    transition: border-color .15s, background .15s;
  }
  .optie label:hover { border-color: var(--flyer-icoon); }
  .optie .icoon { width: 2.6rem; height: 2.6rem; color: var(--flyer-icoon); stroke-width: 1.4; }
  .optie .wat { flex: 1; min-width: 0; }
  .optie .titel { display: block; font-size: .98rem; line-height: 1.3; }
  .optie .titel small { display: block; color: var(--grijs); font-size: .78rem; }
  .optie .prijs { flex: none; color: var(--accent); font-weight: 600; font-size: 1.35rem; white-space: nowrap; }
  .optie input:checked + label { border-color: var(--accent); background: var(--accent-licht); }
  .optie input:checked + label .icoon { color: var(--accent); }
  #fout-keuze { margin: .6rem .4rem 0; }
</style>
</head>
<body>
<div class="pagina">
  <header class="band">
    <img class="kinderen" src="img/kinderen-cadeau.png" alt="Drie lachende kinderen van Grace Home met een cadeau" width="620" height="425">
    <div class="tekst">
      <p class="doe-mee">Doe jij mee?</p>
      <h1>Geef kansarme kinderen hoop</h1>
    </div>
    <p class="kort">Grace Home in India geeft kansarme (wees)kinderen zorg, voedsel, een liefdevol thuis en onderwijs.</p>
  </header>
  <a class="maandlijn" href="b-maandelijks.html?terug=c-gele-band.html">
    <span>Wil je structureel helpen? <strong>Steun maandelijks of sponsor een kind</strong></span>
    <span class="pijl" aria-hidden="true">→</span>
  </a>

  <form id="donatie">
    <section class="cadeaus" id="stap-keuze">
      <h2>Geef een cadeau</h2>
      <div class="opties"></div>
      <p class="fout" id="fout-keuze" aria-live="polite"></p>
    </section>

    <section class="stap" id="stap-gegevens" data-gh-gegevens>
      <h2>Je gegevens</h2>
    </section>
  </form>
</div>

<script src="gedeeld.js"></script>
<script>
  document.querySelector('.opties').innerHTML = GH.OPTIES.eenmalig.map((o) => `
    <div class="optie">
      ${GH.radio(o, 'eenmalig')}
      <label for="k-${o.id}">
        ${GH.icoon(o.icoon)}
        <span class="wat"><span class="titel">${o.titel}${o.id === 'startpakket' ? `<small>${o.uitleg}</small>` : ''}</span></span>
        <span class="prijs">€ ${GH.euro(o.bedrag)}</span>
      </label>
    </div>`).join('');
  GH.start();
</script>
</body>
</html>
