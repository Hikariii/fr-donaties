<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steun maandelijks — Grace Home — Forerunner</title>
<!--
  Ontwerp F, maandelijks: dezelfde kop en kaarten als f-kop-e-kaarten-d.html,
  met de maandelijkse opties. De brede kaart onderaan gaat terug naar eenmalig.
  Onder het raster staat de verwijzing naar persoonlijk sponsoren (forerunner.info).
  De opties, het formulier en de prototypemodus staan in gedeeld.js.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gedeeld.css">
<style>
  /* Band in een lichte tint van de roest (de titelkleur) van forerunner.info.
     Alternatief: zand, hsl(33, 42%, 82%). */
  :root { --band: hsl(18.84, 38%, 95.5%); }
  .pagina { padding-top: 1.25rem; }

  /* Kop zoals de flyer, compact */
  .kop { background: var(--flyer-wit); border-radius: var(--radius); overflow: hidden; position: relative; }
  .kop h1 {
    margin: 0; padding: 1.2rem 1.25rem .2rem;
    color: var(--accent); font-weight: 600;
    font-size: clamp(1.5rem, 5.5vw, 2.1rem); line-height: 1.15;
  }
  .intro { padding: 0 1.25rem; }
  .intro p { margin: .4rem 0 0; font-size: .95rem; }
  .kinderen { display: block; width: 88%; max-width: 420px; height: auto; margin: .5rem auto -20%; position: relative; z-index: 1; }
  .band {
    background: var(--band);
    padding: 20% 1.25rem .9rem;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .9rem;
  }
  .band .doe-mee { margin: 0; font-size: clamp(2.2rem, 8vw, 3rem); }
  .band h2 { margin: 0; color: var(--accent); font-weight: 500; font-size: clamp(1.3rem, 4.5vw, 1.7rem); }
  @media (min-width: 640px) {
    .intro { padding-right: 46%; padding-bottom: 1rem; }
    .kinderen { position: absolute; right: .5rem; bottom: 0; width: 42%; max-width: none; margin: 0; }
    .band { padding: 1.1rem 46% 1rem 1.25rem; min-height: 7.5rem; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
  }

  /* Cadeaus */
  .cadeaus { background: var(--flyer-salie); border-radius: var(--radius); padding: .9rem; margin-top: 1rem; }
  .raster { display: grid; gap: .8rem; grid-template-columns: 1fr 1fr; }
  .optie label {
    position: relative;
    height: 100%; min-height: 9.5rem;
    display: flex; flex-direction: column; justify-content: flex-end; gap: .55rem;
    padding: 1rem .9rem .9rem;
    background: #fff;
    border: 2px solid transparent;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(30, 60, 55, .18);
    transition: border-color .15s, background .15s;
  }
  .optie label:hover { border-color: var(--flyer-icoon); }
  .optie .icoon { width: 3.4rem; height: 3.4rem; color: var(--flyer-icoon); stroke-width: 1.3; }
  .optie .prijs {
    position: absolute; top: .6rem; right: .6rem;
    background: var(--accent); color: #fff;
    font-weight: 700; font-size: 1.05rem; line-height: 1;
    padding: .4rem .65rem; border-radius: 99px;
  }
  .optie .titel { display: block; font-size: .92rem; line-height: 1.3; }
  .optie .prijs small { font-weight: 500; font-size: .75rem; }
  .optie label { padding-top: 2.9rem; }
  .optie .titel small { display: block; color: var(--grijs); font-size: .75rem; margin-top: .1rem; }
  .optie input:checked + label { border-color: var(--accent); background: var(--accent-licht); }
  .optie input:checked + label .icoon { color: var(--accent); }
  .optie input:checked + label .prijs::before { content: "✓ "; }
  @media (min-width: 640px) {
    .optie label { flex-direction: row; align-items: center; justify-content: flex-start; min-height: 7.5rem; padding: 1.1rem 1.1rem; gap: 1rem; }
    .optie .titel { font-size: 1rem; padding-right: 3.5rem; }
  }
  @media (min-width: 640px) { .optie .titel { padding-right: 0; } .optie label { padding-top: 3rem; } }
  @media (max-width: 380px) {
    .optie .titel small { display: none; }
    .optie .icoon { width: 2.8rem; height: 2.8rem; }
  }

  /* Vijfde kaart: maandelijks */
  .maand {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: .9rem;
    min-height: 44px; padding: .95rem 1.1rem;
    background: var(--flyer-wit);
    border: 2px solid var(--petrol);
    border-radius: 12px;
    color: var(--petrol); text-decoration: none;
  }
  .maand:hover { background: #fff; }
  .maand:focus-visible { outline: 3px solid var(--salie); outline-offset: 2px; }
  .maand .icoon { width: 2.4rem; height: 2.4rem; flex: none; }
  .maand .wat { flex: 1; min-width: 0; }
  .maand strong { display: block; font-size: 1rem; }
  .maand span.sub { display: block; font-size: .88rem; }
  .maand .pijl { flex: none; font-size: 1.3rem; }
  #fout-keuze { margin: .6rem 0 0; }
</style>
</head>
<body>
<div class="pagina">
  <header class="kop">
    <h1>Geef kansarme kinderen hoop</h1>
    <div class="intro">
      <p>Grace Home is het gezinshuis van een Indiase familie met wie we al 15 jaar samenwerken.</p>
      <p>Zij vangen kansarme (wees)kinderen op en geven hen zorg, voedsel, een liefdevol thuis en onderwijs.</p>
    </div>
    <img class="kinderen" src="img/kinderen-cadeau.png" alt="Drie lachende kinderen van Grace Home met een cadeau" width="620" height="425">
    <div class="band">
      <p class="doe-mee">Doe jij mee?</p>
      <h2>Steun maandelijks</h2>
    </div>
  </header>

  <form id="donatie">
    <section class="cadeaus" id="stap-keuze" aria-label="Kies je maandelijkse steun">
      <div class="raster"></div>
      <p class="fout" id="fout-keuze" aria-live="polite"></p>
    </section>
    <div data-sponsor></div>

    <section class="stap" id="stap-gegevens" data-gh-gegevens>
      <h2>Je gegevens</h2>
    </section>
  </form>
</div>

<script src="gedeeld.js"></script>
<script>
  const raster = document.querySelector('.raster');
  raster.innerHTML = GH.OPTIES.maandelijks.map((o) => `
    <div class="optie">
      ${GH.radio(o, 'maandelijks')}
      <label for="k-${o.id}">
        <span class="prijs">€ ${GH.euro(o.bedrag)} <small>p/m</small></span>
        ${GH.icoon(o.icoon)}
        <span class="titel">${o.titel}<small>${o.uitleg}</small></span>
      </label>
    </div>`).join('') + `
    <a class="maand" href="f-kop-e-kaarten-d.html">
      ${GH.icoon('cadeau')}
      <span class="wat"><strong>Liever eenmalig een cadeau geven?</strong><span class="sub">Schoolgeld, een startpakket, kleding of een menstruatieset</span></span>
      <span class="pijl" aria-hidden="true">→</span>
    </a>`;
  document.querySelector('[data-sponsor]').innerHTML = GH.sponsorNoot();
  GH.start();
</script>
</body>
</html>
